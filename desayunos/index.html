<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title id="page-title">Categoría — Nutrición</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --cream:   #faf8f3;
      --white:   #ffffff;
      --sage:    #7a9e7e;
      --sage-lt: #b5ceb7;
      --sage-dk: #4d7a53;
      --beige:   #e8e0d0;
      --text:    #2e2a24;
      --muted:   #9e9082;
      --radius:  16px;
      --accent:  #7a9e7e;
      --accent-lt: #ecf4ec;
    }

    html { scroll-behavior: smooth; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--cream);
      color: var(--text);
      min-height: 100vh;
    }

    body::before {
      content: '';
      position: fixed; inset: 0;
      background: radial-gradient(ellipse 70% 40% at 50% 0%, rgba(181,206,183,.2) 0%, transparent 60%);
      pointer-events: none; z-index: 0;
    }

    /* ── TOP BAR ── */
    .topbar {
      position: sticky; top: 0; z-index: 100;
      background: rgba(250,248,243,.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--beige);
      display: flex; align-items: center; gap: 12px;
      padding: 14px 20px;
    }
    .back-btn {
      display: flex; align-items: center; justify-content: center;
      width: 36px; height: 36px; border-radius: 50%;
      background: var(--white); border: 1px solid var(--beige);
      color: var(--text); text-decoration: none;
      box-shadow: 0 2px 6px rgba(0,0,0,.06);
      transition: background .2s;
      flex-shrink: 0;
    }
    .back-btn:hover { background: var(--accent-lt); }
    .back-btn svg { width: 16px; height: 16px; }

    .topbar-info { flex: 1; min-width: 0; }
    .topbar-info h1 {
      font-family: 'Playfair Display', serif;
      font-size: 1.25rem; font-weight: 700;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .topbar-info p {
      font-size: .73rem; color: var(--muted); font-weight: 300;
    }

    .emoji-badge {
      font-size: 1.8rem; flex-shrink: 0;
    }

    /* ── CONTENT ── */
    .content { position: relative; z-index: 1; padding: 20px 16px 60px; }

    /* ── LOADING ── */
    .loading {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 12px;
      padding: 60px 20px; color: var(--muted);
      font-size: .9rem;
    }
    .spinner {
      width: 32px; height: 32px; border-radius: 50%;
      border: 3px solid var(--beige);
      border-top-color: var(--sage);
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── EMPTY STATE ── */
    .empty {
      text-align: center; padding: 60px 24px;
      display: none; flex-direction: column; align-items: center; gap: 12px;
    }
    .empty-icon { font-size: 3.5rem; }
    .empty h2 {
      font-family: 'Playfair Display', serif;
      font-size: 1.2rem; color: var(--text);
    }
    .empty p { font-size: .85rem; color: var(--muted); line-height: 1.6; max-width: 280px; }
    .empty code {
      background: var(--beige); border-radius: 6px;
      padding: 2px 7px; font-size: .78rem; color: var(--sage-dk);
    }

    /* ── GALLERY ── */
    .gallery {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .photo-card {
      background: var(--white);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: 0 4px 16px rgba(74,90,64,.10);
      cursor: pointer;
      transition: transform .2s, box-shadow .2s;
      border: 1px solid rgba(255,255,255,.8);
      animation: fadeUp .4s ease both;
    }
    .photo-card:hover, .photo-card:active {
      transform: scale(1.02);
      box-shadow: 0 10px 28px rgba(74,90,64,.18);
    }

    .photo-card img {
      width: 100%; aspect-ratio: 3/4;
      object-fit: cover; display: block;
      transition: transform .3s ease;
    }
    .photo-card:hover img { transform: scale(1.04); }

    .photo-label {
      padding: 8px 10px 10px;
      font-size: .75rem; font-weight: 500;
      color: var(--muted); text-align: center;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── LIGHTBOX ── */
    .lightbox {
      position: fixed; inset: 0; z-index: 200;
      background: rgba(20,16,12,.92);
      backdrop-filter: blur(6px);
      display: flex; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none;
      transition: opacity .25s;
    }
    .lightbox.open { opacity: 1; pointer-events: all; }

    .lightbox img {
      max-width: 92vw; max-height: 88vh;
      object-fit: contain; border-radius: 12px;
      box-shadow: 0 24px 80px rgba(0,0,0,.5);
      transform: scale(.92);
      transition: transform .3s cubic-bezier(.34,1.56,.64,1);
    }
    .lightbox.open img { transform: scale(1); }

    .lightbox-close {
      position: absolute; top: 18px; right: 18px;
      width: 40px; height: 40px; border-radius: 50%;
      background: rgba(255,255,255,.15); border: none;
      color: #fff; font-size: 1.3rem; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background .2s;
    }
    .lightbox-close:hover { background: rgba(255,255,255,.28); }

    .lightbox-caption {
      position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,.55); border-radius: 999px;
      padding: 6px 18px; color: rgba(255,255,255,.85);
      font-size: .8rem; white-space: nowrap;
    }

    /* ── NAV ARROWS ── */
    .lb-arrow {
      position: absolute; top: 50%; transform: translateY(-50%);
      width: 44px; height: 44px; border-radius: 50%;
      background: rgba(255,255,255,.13); border: none; color: #fff;
      font-size: 1.4rem; cursor: pointer; display: flex;
      align-items: center; justify-content: center;
      transition: background .2s;
    }
    .lb-arrow:hover { background: rgba(255,255,255,.26); }
    .lb-prev { left: 12px; }
    .lb-next { right: 12px; }

    /* Counter badge */
    .lb-counter {
      position: absolute; top: 18px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,.45); border-radius: 999px;
      padding: 4px 14px; color: rgba(255,255,255,.8); font-size: .75rem;
    }
  </style>
</head>
<body>

<!-- TOP BAR (filled by JS) -->
<div class="topbar">
  <a class="back-btn" href="../index.html" aria-label="Volver">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
  </a>
  <div class="topbar-info">
    <h1 id="cat-title">Cargando…</h1>
    <p id="cat-subtitle">Galería de recetas</p>
  </div>
  <div class="emoji-badge" id="cat-emoji">🍽️</div>
</div>

<div class="content">
  <!-- Loading -->
  <div class="loading" id="loading">
    <div class="spinner"></div>
    <span>Cargando imágenes…</span>
  </div>

  <!-- Empty state -->
  <div class="empty" id="empty">
    <div class="empty-icon">📂</div>
    <h2>Aún no hay imágenes</h2>
    <p>Añade fotos a la carpeta<br/><code id="empty-path"></code><br/>y aparecerán aquí automáticamente.</p>
  </div>

  <!-- Gallery -->
  <div class="gallery" id="gallery"></div>
</div>

<!-- Lightbox -->
<div class="lightbox" id="lightbox">
  <div class="lb-counter" id="lb-counter"></div>
  <button class="lb-arrow lb-prev" id="lb-prev" aria-label="Anterior">‹</button>
  <img id="lb-img" src="" alt="" />
  <button class="lb-arrow lb-next" id="lb-next" aria-label="Siguiente">›</button>
  <button class="lightbox-close" id="lb-close" aria-label="Cerrar">✕</button>
  <div class="lightbox-caption" id="lb-caption"></div>
</div>

<script>
/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   CONFIGURACIÓN DE CATEGORÍAS
   Edita aquí el nombre, emoji y la lista de imágenes
   ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
const CATEGORIES = {
  desayunos: {
    title: 'Desayunos',
    subtitle: 'Empieza el día con energía',
    emoji: '🌅',
    folder: '../img/desayunos/',
    /* ➡️  AÑADE AQUÍ EL NOMBRE DE CADA IMAGEN */
    images: [
      'DESAYUNOS.jpg',
    ]
  },
  almuerzos: {
    title: 'Almuerzos',
    subtitle: 'Comidas nutritivas y completas',
    emoji: '☀️',
    folder: '../img/almuerzos/',
    images: [
      'ALMUERZOS.jpg',
    ]
  },
  meriendas: {
    title: 'Meriendas',
    subtitle: 'Snacks saludables y ricos',
    emoji: '🍎',
    folder: '../img/meriendas/',
    images: [
      // Ejemplo: 'hummus-zanahoria.jpg',
      // Ejemplo: 'yogur-granola.jpg',
    ]
  },
  cenas: {
    title: 'Cenas',
    subtitle: 'Cenas ligeras y reconfortantes',
    emoji: '🌙',
    folder: '../img/cenas/',
    images: [
      // Ejemplo: 'sopa-verduras.jpg',
      // Ejemplo: 'tortilla-espinacas.jpg',
    ]
  }
};

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */

// Detect current category from URL path
function getCurrentCategory() {
  const path = window.location.pathname;
  for (const key of Object.keys(CATEGORIES)) {
    if (path.includes('/' + key + '/')) return key;
  }
  return null;
}

const catKey = getCurrentCategory();
const cat = CATEGORIES[catKey] || null;

// Fill UI
if (cat) {
  document.getElementById('page-title').textContent = cat.title + ' — Nutrición';
  document.getElementById('cat-title').textContent = cat.title;
  document.getElementById('cat-subtitle').textContent = cat.subtitle;
  document.getElementById('cat-emoji').textContent = cat.emoji;
  document.getElementById('empty-path').textContent = 'img/' + catKey + '/';
}

// Build gallery
function cleanName(filename) {
  return filename
    .replace(/\.[^.]+$/, '')        // remove extension
    .replace(/[-_]/g, ' ')          // dashes → spaces
    .replace(/\b\w/g, c => c.toUpperCase()); // Title Case
}

function buildGallery(images) {
  const loading = document.getElementById('loading');
  const gallery = document.getElementById('gallery');
  const empty   = document.getElementById('empty');

  loading.style.display = 'none';

  if (!images || images.length === 0) {
    empty.style.display = 'flex';
    return;
  }

  images.forEach((imgFile, i) => {
    const src = cat.folder + imgFile;
    const card = document.createElement('div');
    card.className = 'photo-card';
    card.style.animationDelay = (i * 0.06) + 's';
    card.innerHTML = `
      <img src="${src}" alt="${cleanName(imgFile)}" loading="lazy" />
      <div class="photo-label">${cleanName(imgFile)}</div>
    `;
    card.addEventListener('click', () => openLightbox(i));
    gallery.appendChild(card);
  });
}

// ── LIGHTBOX ──
let currentIndex = 0;
let imageList = [];

function openLightbox(index) {
  currentIndex = index;
  imageList = cat.images;
  updateLightbox();
  document.getElementById('lightbox').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.body.style.overflow = '';
}

function updateLightbox() {
  const img   = document.getElementById('lb-img');
  const cap   = document.getElementById('lb-caption');
  const ctr   = document.getElementById('lb-counter');
  const file  = imageList[currentIndex];
  img.src     = cat.folder + file;
  img.alt     = cleanName(file);
  cap.textContent = cleanName(file);
  ctr.textContent = (currentIndex + 1) + ' / ' + imageList.length;
}

document.getElementById('lb-close').addEventListener('click', closeLightbox);
document.getElementById('lb-prev').addEventListener('click', () => {
  currentIndex = (currentIndex - 1 + imageList.length) % imageList.length;
  updateLightbox();
});
document.getElementById('lb-next').addEventListener('click', () => {
  currentIndex = (currentIndex + 1) % imageList.length;
  updateLightbox();
});

// Click outside image closes
document.getElementById('lightbox').addEventListener('click', e => {
  if (e.target === document.getElementById('lightbox')) closeLightbox();
});

// Swipe support
let touchStartX = 0;
document.getElementById('lightbox').addEventListener('touchstart', e => {
  touchStartX = e.touches[0].clientX;
}, { passive: true });
document.getElementById('lightbox').addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - touchStartX;
  if (Math.abs(dx) > 50) {
    currentIndex = dx < 0
      ? (currentIndex + 1) % imageList.length
      : (currentIndex - 1 + imageList.length) % imageList.length;
    updateLightbox();
  }
}, { passive: true });

// Keyboard
document.addEventListener('keydown', e => {
  if (!document.getElementById('lightbox').classList.contains('open')) return;
  if (e.key === 'ArrowRight') { currentIndex = (currentIndex + 1) % imageList.length; updateLightbox(); }
  if (e.key === 'ArrowLeft')  { currentIndex = (currentIndex - 1 + imageList.length) % imageList.length; updateLightbox(); }
  if (e.key === 'Escape') closeLightbox();
});

// ── INIT ──
if (cat) {
  buildGallery(cat.images);
} else {
  document.getElementById('loading').style.display = 'none';
  document.getElementById('empty').style.display = 'flex';
}
</script>
</body>
</html>
